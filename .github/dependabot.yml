# Dependabot: GitHub automatically opens pull requests to update
# dependencies (especially security fixes). Review & merge when the build passes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
