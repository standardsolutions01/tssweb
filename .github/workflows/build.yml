# Builds the site and runs the safety checks on pull requests into main and on main itself
# (not on every upload — see docs/GITHUB-SAFETY.md).
# A red ❌ on GitHub means something needs fixing before merging to main.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this job can only read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
