# Builds the site and runs the safety checks on every push and pull request.
# A red ❌ on GitHub means something needs fixing before merging to main.
name: build

on:
  push:
  pull_request:

# Least privilege: this job can only read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
